# .github/workflows/debug-apk.yml
#
# - Every push to any branch, or the "Run workflow" button: builds a debug APK and
#   saves it as a downloadable build artifact (Actions tab -> the run -> Artifacts).
# - Pushing a tag like v0.1.0: also publishes a GitHub release with the APK attached,
#   which is what Stellarite Apps lists.
#     git tag v0.1.0 && git push origin v0.1.0

name: Debug APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle on the runner, so the repo doesn't need to contain gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: gradle assembleDebug -PversionName="${{ steps.ver.outputs.name }}"

      - name: Save APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ github.event.repository.name }}-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/*-debug.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
