# .github/workflows/debug-apk.yml
#
# Builds a debug APK and attaches it to a GitHub release when you push a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Stellarite Apps lists the repo once its latest release has an .apk attached.

name: Debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PversionName="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ github.event.repository.name }}-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/*-debug.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
